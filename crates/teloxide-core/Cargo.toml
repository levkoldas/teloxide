[package]
name = "teloxide-core"
version = "0.13.0"
description = "Core part of the `teloxide` library - telegram bot API client"

rust-version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

documentation = "https://docs.rs/teloxide-core/"
readme = "README.md"

keywords = ["teloxide", "telegram", "telegram-bot", "telegram-bot-api", "bot"]
categories = ["api-bindings", "asynchronous"]


[features]
# NB: When adding features here, don't forget to update teloxide's Cargo.toml

default = ["native-tls"]

rustls = ["reqwest/rustls"]
rustls-native-roots = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

# Features which require nightly compiler.
#
# Currently the only used compiler feature is feature(type_alias_impl_trait)
# which allow implementing `Future`s without boxing.
nightly = []

# Throttling bot adaptor
throttle = ["vecrem"]

# Trace bot adaptor
trace_adaptor = []

# Erased bot adaptor
erased = []

# CacheMe bot adaptor
cache_me = []

# All features except nightly and tls-related
full = ["throttle", "trace_adaptor", "erased", "cache_me"]


[dependencies]
schemars = { version = "1.2.3", features = ["chrono04", "url2"]}
futures = "0.3.34"
tokio = { version = "1.54.1", features = ["fs", "io-util"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
pin-project = "1.1.13"
bytes = "1.12.1"
reqwest = { version = "0.13.5", features = [
    "json",
    "stream",
    "multipart",
], default-features = false }
url = { version = "2.5.8", features = ["serde"] }
log = "0.4.35"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.24.0"
uuid = { version = "1.29.0", features = ["v4"] }        # for attaching input files

stacker = "0.1.25"

derive_more = { version = "2.1.1", features = ["display", "from", "deref"] }
mime = "0.3.17"
thiserror = "2.0.21"
once_cell = "1.21.4"
takecell = "0.1.2"
take_mut = "0.2.2"
rc-box = "1.3.0"
chrono = { version = "0.4.45", default-features = false }
either = "1.19.0"
bitflags = "2.13.2"
rgb = "0.8.53"

vecrem = { version = "0.1.0", optional = true }


[dev-dependencies]
pretty_env_logger = "0.5.0"
tokio = { version = "1.54.1", features = [
    "fs",
    "macros",
    "rt-multi-thread",
] }
cool_asserts = "2.0.4"

xshell = "0.2.7"
ron = "0.12.3"
indexmap = { version = "2.14.2", features = ["serde"] }
aho-corasick = "1.1.5"
itertools = "0.15.0"
pretty_assertions = "1.4.1"


[package.metadata.docs.rs]
features = ["full", "nightly", "tokio/macros", "tokio/rt-multi-thread"]
rustdoc-args = ["--cfg", "docsrs", "-Znormalize-docs"]

# https://github.com/rust-lang/rust/issues/88791
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[package.metadata.release]
tag-prefix = "core-"
enable-features = ["full"]
pre-release-replacements = [
    { file = "README.md", search = "teloxide-core = \"[^\"]+\"", replace = "teloxide-core = \"{{version}}\"" },
    { file = "src/lib.rs", search = "teloxide-core = \"[^\"]+\"", replace = "teloxide-core = \"{{version}}\"" },
    { file = "CHANGELOG.md", search = "## unreleased", replace = "## unreleased\n\n## {{version}} - {{date}}", exactly = 1 },
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(dep_docsrs)'] }

[[example]]
name = "self_info"
required-features = ["tokio/macros", "tokio/rt-multi-thread"]

# This is required due to some stuff with dev-dependencies,
# backwards compatability and cargo:
# https://doc.rust-lang.org/nightly/cargo/reference/unstable.html#scrape-examples
doc-scrape-examples = true

[[example]]
name = "erased"
required-features = [
    "tokio/macros",
    "tokio/rt-multi-thread",
    "erased",
    "trace_adaptor",
]
